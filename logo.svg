  <text x="34" y="17" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="14" letter-spacing="3.4"><tspan fill="#fafafa" font-weight="600">ACE</tspan><tspan fill="#a3a3a3" font-weight="500"> AUTOMATION</tspan></text>
</svg>
